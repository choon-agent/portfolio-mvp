[pytest]
# 사용자 정의 마커 등록 — 등록 안 된 마커는 PytestUnknownMarkWarning 발생.
markers =
    golden: 골든 스냅샷 회귀 검증 (실제 LLM 호출 없이 저장된 JSON 만 검증). CI 에서 제외하려면 -m "not golden". 스냅샷 생성은 scripts/run_bullbear_golden.py.
    deepeval: DeepEval G-Eval 기반 응답 품질 평가 (judge LLM 호출 발생 — 기본 3 criteria, 호출당 ~$0.045/snapshot, 8건 ≈ $0.37 — docs §11.5 baseline). 통상 CI 제외 (-m "not deepeval"). 환경변수 ANTHROPIC_API_KEY 필요.
